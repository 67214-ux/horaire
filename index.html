<head>
  <meta charset="UTF-8">

  <title>Comparateur d'horaires</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .classes-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .class-box {
      padding: 15px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #ddd;
      text-align: center;
      font-weight: bold;
    }

    button {
      display: block;
      margin: 20px auto 0;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #error {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      display: none;
    }

    .day {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    .day h2 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }

    .schedule {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    .schedule th,
    .schedule td {
      border: 1px solid #ddd;
      padding: 10px;
      vertical-align: top;
    }

    .schedule th {
      background: #1f2937;
      color: white;
      text-align: center;
    }

    .time-column {
      width: 130px;
      text-align: center;
      white-space: nowrap;
      font-weight: bold;
    }

    .class-column {
      width: calc((100% - 130px) / 3);
      text-align: center;
    }

    .course {
      background: #eef4ff;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
      padding: 8px;
      margin: 3px 0;
      text-align: left;
    }

    .course-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .course-time {
      font-size: 12px;
      color: #555;
    }

    .pause {
      background: #f3f4f6;
      color: #6b7280;
      text-align: center !important;
      font-style: italic;
      font-weight: bold;
    }

    .empty {
      color: #aaa;
      text-align: center;
      font-style: italic;
    }

    .no-data {
      padding: 30px;
      text-align: center;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }

    @media (max-width: 900px) {
      body {
        padding: 15px;
      }

      .classes-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<div class="container">

</div>

`;


/* ============================================================
   PAUSES FIXES
   ============================================================ */

const BREAKS = [

  {
    start: 10 * 60,
    end: 10 * 60 + 15,
    label: "Pause"
  },

  {
    start: 12 * 60 + 15,
    end: 13 * 60 + 15,
    label: "Pause déjeuner"
  }

];


/* ============================================================
   ÉVÉNEMENTS À IGNORER
   ============================================================ */

const IGNORE_KEYWORDS = [

  "pause",
  "break",
  "récréation",
  "recreation",
  "intercours",
  "temps libre",
  "lunch",
  "déjeuner",
  "dejeuner",
  "congé",
  "conge",

  "séance d'informations",
  "seance d'informations",
  "séance d’information",
  "seance d’information"

];


/* ============================================================
   OUTILS DATE / HEURE
   ============================================================ */

function parseICSDate(value) {

  if (!value) {
    return null;
  }

  value = value.trim();


  /*
   * Format UTC :
   *
   * 20260922T081500Z
   */

  if (/^\d{8}T\d{6}Z$/.test(value)) {

    const year =
      Number(value.substring(0, 4));

    const month =
      Number(value.substring(4, 6)) - 1;

    const day =
      Number(value.substring(6, 8));

    const hour =
      Number(value.substring(9, 11));

    const minute =
      Number(value.substring(11, 13));

    const second =
      Number(value.substring(13, 15));

    return new Date(
      Date.UTC(
        year,
        month,
        day,
        hour,
        minute,
        second
      )
    );
  }


  /*
   * Format sans Z
   */

  if (/^\d{8}T\d{6}$/.test(value)) {

    const year =
      Number(value.substring(0, 4));

    const month =
      Number(value.substring(4, 6)) - 1;

    const day =
      Number(value.substring(6, 8));

    const hour =
      Number(value.substring(9, 11));

    const minute =
      Number(value.substring(11, 13));

    const second =
      Number(value.substring(13, 15));

    return new Date(
      year,
      month,
      day,
      hour,
      minute,
      second
    );
  }


  /*
   * Format date uniquement
   *
   * 20260922
   */

  if (/^\d{8}$/.test(value)) {

    const year =
      Number(value.substring(0, 4));

    const month =
      Number(value.substring(4, 6)) - 1;

    const day =
      Number(value.substring(6, 8));

    return new Date(
      year,
      month,
      day
    );
  }


  const date = new Date(value);

  return isNaN(date.getTime())
    ? null
    : date;
}


/* ============================================================
   FORMATAGE BRUXELLES
   ============================================================ */

const brusselsFormatter =
  new Intl.DateTimeFormat(
    "fr-BE",
    {
      timeZone: "Europe/Brussels",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  );


const brusselsDateFormatter =
  new Intl.DateTimeFormat(
    "fr-BE",
    {
      timeZone: "Europe/Brussels",
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );


const brusselsDatePartsFormatter =
  new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone: "Europe/Brussels",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );


function formatTime(date) {

  return brusselsFormatter.format(date);

}


function formatDate(date) {

  const text =
    brusselsDateFormatter.format(date);

  return (
    text.charAt(0).toUpperCase() +
    text.slice(1)
  );

}


function getDateKey(date) {

  const parts =
    brusselsDatePartsFormatter.formatToParts(date);

  let year = "";
  let month = "";
  let day = "";

  for (const part of parts) {

    if (part.type === "year") {
      year = part.value;
    }

    if (part.type === "month") {
      month = part.value;
    }

    if (part.type === "day") {
      day = part.value;
    }

  }

  return `${year}-${month}-${day}`;
}


function getMinutes(date) {

  const parts =
    new Intl.DateTimeFormat(
      "fr-BE",
      {
        timeZone: "Europe/Brussels",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).formatToParts(date);

  let hour = 0;
  let minute = 0;

  for (const part of parts) {

    if (part.type === "hour") {
      hour = Number(part.value);
    }

    if (part.type === "minute") {
      minute = Number(part.value);
    }

  }

  return hour * 60 + minute;
}


/* ============================================================
   OUTILS ICS
   ============================================================ */

function unfoldICS(text) {

  return text
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .replace(/\n[ \t]/g, "");

}


function getICSProperty(line, property) {

  const regex =
    new RegExp(
      "^" +
      property +
      "(?:;[^:]* )?:(.*)$",
      "i"
    );

  const match =
    line.match(regex);

  return match
    ? match[1].trim()
    : null;
}


/*
 * Version plus robuste pour les propriétés ICS
 * avec paramètres :
 *
 * DTSTART;TZID=Europe/Brussels:...
 */

function getICSPropertyValue(line, property) {

  const colonIndex =
    line.indexOf(":");

  if (colonIndex === -1) {
    return null;
  }

  const propertyPart =
    line.substring(0, colonIndex);

  const propertyName =
    propertyPart
      .split(";")[0]
      .toUpperCase();

  if (propertyName !== property.toUpperCase()) {
    return null;
  }

  return line
    .substring(colonIndex + 1)
    .trim();
}


function unescapeICS(value) {

  if (!value) {
    return "";
  }

  return value
    .replace(/\\n/gi, "\n")
    .replace(/\\,/g, ",")
    .replace(/\\;/g, ";")
    .replace(/\\\\/g, "\\");
}


/* ============================================================
   IGNORER CERTAINS ÉVÉNEMENTS
   ============================================================ */

function shouldIgnoreEvent(event) {

  const text = (
    event.summary +
    " " +
    event.description
  ).toLowerCase();

  return IGNORE_KEYWORDS.some(
    keyword =>
      text.includes(
        keyword.toLowerCase()
      )
  );

}


/* ============================================================
   LECTURE ICS
   ============================================================ */

function parseICS(text) {

  if (!text || !text.trim()) {
    return [];
  }

  text = unfoldICS(text);

  const lines =
    text.split("\n");

  const events = [];

  let currentEvent = null;


  for (const line of lines) {

    const cleanLine =
      line.trim();


    /*
     * Début événement
     */

    if (
      cleanLine.toUpperCase() ===
      "BEGIN:VEVENT"
    ) {

      currentEvent = {

        summary: "",

        description: "",
        location: "",

        start: null,

        end: null

      };

      continue;
    }


    /*
     * Fin événement
     */

    if (
      cleanLine.toUpperCase() ===
      "END:VEVENT"
    ) {

      if (
        currentEvent &&
        currentEvent.start &&
        currentEvent.end
      ) {

        if (
          !shouldIgnoreEvent(
            currentEvent
          )
        ) {

          events.push(
            currentEvent
          );

        }

      }

      currentEvent = null;

      continue;
    }


    if (!currentEvent) {
      continue;
    }


    /*
     * SUMMARY
     */

    const summary =
      getICSPropertyValue(
        cleanLine,
        "SUMMARY"
      );

    if (summary !== null) {

      currentEvent.summary =
        unescapeICS(summary);

      continue;
    }


    /*
     * DESCRIPTION
     */

    const description =
      getICSPropertyValue(
        cleanLine,
        "DESCRIPTION"
      );

    if (description !== null) {

      currentEvent.description =
        unescapeICS(description);

      continue;
    }


    /*
     * DTSTART
     */

    const dtstart =
      getICSPropertyValue(
        cleanLine,
        "DTSTART"
      );

    if (dtstart !== null) {

      currentEvent.start =
        parseICSDate(dtstart);

      continue;
    }


    /*
     * DTEND
     */

    const dtend =
      getICSPropertyValue(
        cleanLine,
        "DTEND"
      );

    if (dtend !== null) {

      currentEvent.end =
        parseICSDate(dtend);

      continue;
    }

  }


  return events;
}


/* ============================================================
   GROUPER PAR JOUR
   ============================================================ */

function groupEventsByDay(events) {

  const result = {};

  for (const event of events) {

    const key =
      getDateKey(event.start);

    if (!result[key]) {
      result[key] = [];
    }

    result[key].push(event);
  }

  return result;
}


/* ============================================================
   RÉCUPÉRER LES JOURS
   ============================================================ */

function getAllDays(allClasses) {

  const days =
    new Set();

  for (const events of allClasses) {

    for (const event of events) {

      days.add(
        getDateKey(event.start)
      );

    }

  }

  return Array.from(days).sort();
}


/* ============================================================
   CONVERSION DATE
   ============================================================ */

function dateFromKey(key) {

  const [
    year,
    month,
    day
  ] =
    key
      .split("-")
      .map(Number);

  return new Date(
    Date.UTC(
      year,
      month - 1,
      day,
      12,
      0,
      0
    )
  );

}


/* ============================================================
   CRÉATION DES LIGNES HORAIRES
   ============================================================ */

function getTimeRows(dayEvents) {

  const times =
    new Set();


  /*
   * Ajouter les pauses
   */

  for (const pause of BREAKS) {

    times.add(pause.start);
    times.add(pause.end);

  }


  /*
   * Ajouter les débuts/fins
   */

  for (const events of dayEvents) {

    for (const event of events) {

      times.add(
        getMinutes(event.start)
      );

      times.add(
        getMinutes(event.end)
      );

    }

  }


  return Array.from(times)
    .sort((a, b) => a - b);

}


/* ============================================================
   TROUVER LES COURS
   ============================================================ */

function getEventsAtTime(
  events,
  start,
  end
) {

  return events.filter(
    event => {

      const eventStart =
        getMinutes(event.start);

      const eventEnd =
        getMinutes(event.end);


      return (
        eventStart < end &&
        eventEnd > start
      );

    }
  );

}


/* ============================================================
   PAUSE
   ============================================================ */

function getBreakForSlot(
  start,
  end
) {

  for (const pause of BREAKS) {

    if (
      start >= pause.start &&
      end <= pause.end
    ) {

      return pause;

    }

  }

  return null;
}


/* ============================================================
   AFFICHER UN COURS
   ============================================================ */

function createCourseElement(event) {

  const div =
    document.createElement("div");

  div.className =
    "course";


  const name =
    document.createElement("div");

  name.className =
    "course-name";

  name.textContent =
    event.summary ||
    "Cours sans nom";


  const time =
    document.createElement("div");

  time.className =
    "course-time";

  time.textContent =
    `${formatTime(event.start)} – ${formatTime(event.end)}`;


  div.appendChild(name);

  div.appendChild(time);

  return div;
}


/* ============================================================
   AFFICHER UNE JOURNÉE
   ============================================================ */

function renderDay(
  dateKey,
  allClasses
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "day";


  /*
   * Titre
   */

  const title =
    document.createElement("h2");

  title.textContent =
    formatDate(
      dateFromKey(dateKey)
    );

  wrapper.appendChild(title);


  /*
   * Événements du jour
   */

  const dayEvents =
    allClasses.map(
      events =>
        events.filter(
          event =>
            getDateKey(
              event.start
            ) === dateKey
        )
    );


  /*
   * Aucun événement
   */

  const hasEvents =
    dayEvents.some(
      events =>
        events.length > 0
    );


  if (!hasEvents) {

    const noData =
      document.createElement("div");

    noData.className =
      "no-data";

    noData.textContent =
      "Aucun cours ce jour.";

    wrapper.appendChild(noData);

    return wrapper;
  }


  /*
   * Créneaux
   */

  const times =
    getTimeRows(dayEvents);


  /*
   * TABLE
   */

  const table =
    document.createElement("table");

  table.className =
    "schedule";


  /*
   * THEAD
   */

  const thead =
    document.createElement("thead");

  const headerRow =
    document.createElement("tr");


  /*
   * Colonne horaire
   */

  const timeHeader =
    document.createElement("th");

  timeHeader.className =
    "time-column";

  timeHeader.textContent =
    "Horaire";

  headerRow.appendChild(
    timeHeader
  );


  /*
   * Colonnes classes
   */

  for (
    const className
    of CLASS_NAMES
  ) {

    const th =
      document.createElement("th");

    th.className =
      "class-column";

    th.textContent =
      `Classe ${className}`;

    headerRow.appendChild(th);
  }


  thead.appendChild(
    headerRow
  );

  table.appendChild(
    thead
  );


  /*
   * TBODY
   */

  const tbody =
    document.createElement("tbody");


  /*
   * Chaque intervalle
   */

  for (
    let i = 0;
    i < times.length - 1;
    i++
  ) {

    const start =
      times[i];

    const end =
      times[i + 1];


    if (start === end) {
      continue;
    }


    /*
     * Vérifier pause
     */

    const pause =
      getBreakForSlot(
        start,
        end
      );


    const row =
      document.createElement("tr");


    /*
     * Horaire
     */

    const timeCell =
      document.createElement("td");

    timeCell.className =
      "time-column";

    timeCell.textContent =
      `${formatMinutes(start)} – ${formatMinutes(end)}`;

    row.appendChild(
      timeCell
    );


    /*
     * Pause
     */

    if (pause) {

      const pauseCell =
        document.createElement("td");

      pauseCell.colSpan = 3;

      pauseCell.className =
        "pause";

      pauseCell.textContent =
        pause.label;

      row.appendChild(
        pauseCell
      );

      tbody.appendChild(
        row
      );

      continue;
    }


    /*
     * Une colonne par classe
     */

    for (
      let classIndex = 0;
      classIndex < 3;
      classIndex++
    ) {

      const cell =
        document.createElement("td");


      const events =
        getEventsAtTime(
          dayEvents[classIndex],
          start,
          end
        );


      if (events.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "—";

        cell.appendChild(
          empty
        );

      } else {

        for (
          const event
          of events
        ) {

          cell.appendChild(
            createCourseElement(
              event
            )
          );

        }

      }


      row.appendChild(
        cell
      );

    }


    tbody.appendChild(
      row
    );

  }


  table.appendChild(
    tbody
  );

  wrapper.appendChild(
    table
  );


  return wrapper;
}


/* ============================================================
   FORMAT MINUTES
   ============================================================ */

function formatMinutes(minutes) {

  const hour =
    Math.floor(
      minutes / 60
    );

  const minute =
    minutes % 60;

  return (
    String(hour).padStart(2, "0") +
    ":" +
    String(minute).padStart(2, "0")
  );

}


/* ============================================================
   AFFICHER TOUS LES JOURS
   ============================================================ */

function renderAllDays(
  allClasses
) {

  const results =
    document.getElementById(
      "results"
    );

  results.innerHTML = "";


  const days =
    getAllDays(
      allClasses
    );


  /*
   * Aucun cours
   */

  if (days.length === 0) {

    const panel =
      document.createElement("div");

    panel.className =
      "panel";

    panel.innerHTML = `
      <div class="no-data">
        Aucun cours trouvé dans les horaires ICS.
      </div>
    `;

    results.appendChild(
      panel
    );

    return;
  }


  /*
   * Afficher chaque jour
   */

  for (
    const day
    of days
  ) {

    results.appendChild(
      renderDay(
        day,
        allClasses
      )
    );

  }

}


/* ============================================================
   AFFICHER LES HORAIRES
   ============================================================ */

document
  .getElementById("showButton")
  .addEventListener(
    "click",
    () => {

      const error =
        document.getElementById(
          "error"
        );

      error.style.display =
        "none";

      error.textContent =
        "";


      try {

        /*
         * Lire directement les 3 textes ICS
         */

        const events2B =
          parseICS(ICS_2B);

        const events2A =
          parseICS(ICS_2A);

        const events2C =
          parseICS(ICS_2C);


        /*
         * Tableau final
         */

        const allClasses = [

          events2B,

          events2A,

          events2C

        ];


        /*
         * Afficher
         */

        renderAllDays(
          allClasses
        );

      }

      catch (err) {

        console.error(err);

        error.textContent =
          err.message ||
          "Une erreur est survenue.";

        error.style.display =
          "block";

      }

    }
  );


</script>
