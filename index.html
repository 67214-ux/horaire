<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comparateur d'horaires</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .upload-box {
      border: 2px dashed #bbb;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }

    .upload-box h3 {
      margin-top: 0;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 10px;
    }

    button {
      display: block;
      margin: 20px auto 0;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #error {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      display: none;
    }

    .day {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    .day h2 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }

    .schedule {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    .schedule th,
    .schedule td {
      border: 1px solid #ddd;
      padding: 10px;
      vertical-align: top;
    }

    .schedule th {
      background: #1f2937;
      color: white;
      text-align: center;
    }

    .time-column {
      width: 130px;
      text-align: center;
      white-space: nowrap;
      font-weight: bold;
    }

    .class-column {
      width: calc((100% - 130px) / 3);
      text-align: center;
    }

    .course {
      background: #eef4ff;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
      padding: 8px;
      margin: 3px 0;
      text-align: left;
    }

    .course-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .course-time {
      font-size: 12px;
      color: #555;
    }

    .pause {
      background: #f3f4f6;
      color: #6b7280;
      text-align: center !important;
      font-style: italic;
      font-weight: bold;
    }

    .empty {
      color: #aaa;
      text-align: center;
      font-style: italic;
    }

    .no-data {
      padding: 30px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 900px) {
      body {
        padding: 15px;
      }

      .upload-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="panel">

    <h1>Comparateur d'horaires</h1>

    <div class="upload-grid">

      <div class="upload-box">
        <h3>Classe B1</h3>
        <input
          type="file"
          id="fileB1"
          accept=".ics,text/calendar"
        >
      </div>

      <div class="upload-box">
        <h3>Classe B2</h3>
        <input
          type="file"
          id="fileB2"
          accept=".ics,text/calendar"
        >
      </div>

      <div class="upload-box">
        <h3>Classe B3</h3>
        <input
          type="file"
          id="fileB3"
          accept=".ics,text/calendar"
        >
      </div>

    </div>

    <button id="showButton">
      Afficher les horaires
    </button>

    <div id="error"></div>

  </div>

  <div id="results"></div>

</div>


<script>

  /*
   * ============================================================
   * CONFIGURATION
   * ============================================================
   */

  const CLASS_NAMES = [
    "B1",
    "B2",
    "B3"
  ];

  /*
   * Pauses fixes de la journée.
   * Elles sont affichées visuellement mais ne sont pas
   * considérées comme des cours.
   */
  const BREAKS = [
    {
      start: 10 * 60,
      end: 10 * 60 + 15,
      label: "Pause"
    },
    {
      start: 12 * 60 + 15,
      end: 13 * 60 + 15,
      label: "Pause déjeuner"
    }
  ];

  /*
   * Événements à ignorer.
   */
  const IGNORE_KEYWORDS = [
    "pause",
    "break",
    "récréation",
    "recreation",
    "intercours",
    "temps libre",
    "lunch",
    "déjeuner",
    "dejeuner",
    "congé",
    "conge",
    "séance d'informations",
    "seance d'informations",
    "séance d’information",
    "seance d’information"
  ];


  /*
   * ============================================================
   * OUTILS DATE / HEURE
   * ============================================================
   */

  function parseICSDate(value) {

    if (!value) {
      return null;
    }

    value = value.trim();

    /*
     * Format UTC Hyperplanning :
     *
     * 20260922T081500Z
     *
     * Le Z signifie UTC.
     */

    if (/^\d{8}T\d{6}Z$/.test(value)) {

      const year = Number(value.substring(0, 4));
      const month = Number(value.substring(4, 6)) - 1;
      const day = Number(value.substring(6, 8));

      const hour = Number(value.substring(9, 11));
      const minute = Number(value.substring(11, 13));
      const second = Number(value.substring(13, 15));

      return new Date(
        Date.UTC(
          year,
          month,
          day,
          hour,
          minute,
          second
        )
      );
    }

    /*
     * Format sans Z.
     */

    if (/^\d{8}T\d{6}$/.test(value)) {

      const year = Number(value.substring(0, 4));
      const month = Number(value.substring(4, 6)) - 1;
      const day = Number(value.substring(6, 8));

      const hour = Number(value.substring(9, 11));
      const minute = Number(value.substring(11, 13));
      const second = Number(value.substring(13, 15));

      return new Date(
        year,
        month,
        day,
        hour,
        minute,
        second
      );
    }

    /*
     * Format uniquement date :
     *
     * 20260922
     */

    if (/^\d{8}$/.test(value)) {

      const year = Number(value.substring(0, 4));
      const month = Number(value.substring(4, 6)) - 1;
      const day = Number(value.substring(6, 8));

      return new Date(
        year,
        month,
        day
      );
    }

    return new Date(value);
  }


  /*
   * Formatage en heure belge.
   */

  const brusselsFormatter = new Intl.DateTimeFormat(
    "fr-BE",
    {
      timeZone: "Europe/Brussels",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  );


  const brusselsDateFormatter = new Intl.DateTimeFormat(
    "fr-BE",
    {
      timeZone: "Europe/Brussels",
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );


  const brusselsDatePartsFormatter = new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone: "Europe/Brussels",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );


  function formatTime(date) {

    return brusselsFormatter.format(date);

  }


  function formatDate(date) {

    const text = brusselsDateFormatter.format(date);

    return text.charAt(0).toUpperCase() + text.slice(1);

  }


  function getDateKey(date) {

    const parts = brusselsDatePartsFormatter.formatToParts(date);

    let year = "";
    let month = "";
    let day = "";

    for (const part of parts) {

      if (part.type === "year") {
        year = part.value;
      }

      if (part.type === "month") {
        month = part.value;
      }

      if (part.type === "day") {
        day = part.value;
      }
    }

    return `${year}-${month}-${day}`;
  }


  function getMinutes(date) {

    const parts = new Intl.DateTimeFormat(
      "fr-BE",
      {
        timeZone: "Europe/Brussels",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).formatToParts(date);

    let hour = 0;
    let minute = 0;

    for (const part of parts) {

      if (part.type === "hour") {
        hour = Number(part.value);
      }

      if (part.type === "minute") {
        minute = Number(part.value);
      }
    }

    return hour * 60 + minute;
  }


  /*
   * ============================================================
   * OUTILS ICS
   * ============================================================
   */

  function unfoldICS(text) {

    /*
     * Dans les fichiers ICS, une ligne peut continuer sur
     * la ligne suivante avec un espace ou une tabulation.
     */

    return text
      .replace(/\r\n/g, "\n")
      .replace(/\n[ \t]/g, "");
  }


  function getICSProperty(line, property) {

    const regex = new RegExp(
      "^" + property + "(?:;[^:]*)?:(.*)$",
      "i"
    );

    const match = line.match(regex);

    return match ? match[1].trim() : null;
  }


  function unescapeICS(value) {

    if (!value) {
      return "";
    }

    return value
      .replace(/\\n/gi, "\n")
      .replace(/\\,/g, ",")
      .replace(/\\;/g, ";")
      .replace(/\\\\/g, "\\");
  }


  function shouldIgnoreEvent(event) {

    const text = (
      event.summary +
      " " +
      event.description
    ).toLowerCase();

    return IGNORE_KEYWORDS.some(keyword =>
      text.includes(keyword.toLowerCase())
    );
  }


  function parseICS(text) {

    text = unfoldICS(text);

    const lines = text.split("\n");

    const events = [];

    let currentEvent = null;

    for (const line of lines) {

      const cleanLine = line.trim();

      if (cleanLine === "BEGIN:VEVENT") {

        currentEvent = {
          summary: "",
          description: "",
          start: null,
          end: null
        };

        continue;
      }


      if (cleanLine === "END:VEVENT") {

        if (
          currentEvent &&
          currentEvent.start &&
          currentEvent.end
        ) {

          if (!shouldIgnoreEvent(currentEvent)) {

            events.push(currentEvent);

          }
        }

        currentEvent = null;

        continue;
      }


      if (!currentEvent) {
        continue;
      }


      const summary = getICSProperty(
        cleanLine,
        "SUMMARY"
      );

      if (summary !== null) {

        currentEvent.summary =
          unescapeICS(summary);

        continue;
      }


      const description = getICSProperty(
        cleanLine,
        "DESCRIPTION"
      );

      if (description !== null) {

        currentEvent.description =
          unescapeICS(description);

        continue;
      }


      const dtstart = getICSProperty(
        cleanLine,
        "DTSTART"
      );

      if (dtstart !== null) {

        currentEvent.start =
          parseICSDate(dtstart);

        continue;
      }


      const dtend = getICSProperty(
        cleanLine,
        "DTEND"
      );

      if (dtend !== null) {

        currentEvent.end =
          parseICSDate(dtend);

        continue;
      }
    }

    return events;
  }


  /*
   * ============================================================
   * LECTURE DES FICHIERS
   * ============================================================
   */

  async function readICSFile(input) {

    if (!input.files || input.files.length === 0) {
      return [];
    }

    const file = input.files[0];

    const text = await file.text();

    return parseICS(text);
  }


  /*
   * ============================================================
   * GROUPER LES ÉVÉNEMENTS PAR JOUR
   * ============================================================
   */

  function groupEventsByDay(events) {

    const result = {};

    for (const event of events) {

      const key = getDateKey(event.start);

      if (!result[key]) {
        result[key] = [];
      }

      result[key].push(event);
    }

    return result;
  }


  /*
   * ============================================================
   * RÉCUPÉRER LES JOURS
   * ============================================================
   */

  function getAllDays(allClasses) {

    const days = new Set();

    for (const events of allClasses) {

      for (const event of events) {

        days.add(
          getDateKey(event.start)
        );
      }
    }

    return Array.from(days).sort();

  }


  /*
   * ============================================================
   * CONVERSION DATE
   * ============================================================
   */

  function dateFromKey(key) {

    const [year, month, day] =
      key.split("-").map(Number);

    /*
     * On utilise midi UTC afin d'éviter les problèmes de
     * changement de jour liés au fuseau horaire.
     */

    return new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        12,
        0,
        0
      )
    );
  }


  /*
   * ============================================================
   * CRÉATION DES LIGNES HORAIRES
   * ============================================================
   */

  function getTimeRows(dayEvents) {

    const times = new Set();

    /*
     * Toujours inclure les pauses.
     */

    for (const pause of BREAKS) {

      times.add(pause.start);
      times.add(pause.end);

    }


    /*
     * Ajouter les débuts et fins de cours.
     */

    for (const events of dayEvents) {

      for (const event of events) {

        times.add(
          getMinutes(event.start)
        );

        times.add(
          getMinutes(event.end)
        );

      }
    }

    return Array.from(times)
      .sort((a, b) => a - b);

  }


  /*
   * ============================================================
   * TROUVER LES COURS À UN MOMENT DONNÉ
   * ============================================================
   */

  function getEventsAtTime(events, start, end) {

    return events.filter(event => {

      const eventStart =
        getMinutes(event.start);

      const eventEnd =
        getMinutes(event.end);

      /*
       * Le cours est affiché s'il recouvre la période.
       */

      return (
        eventStart < end &&
        eventEnd > start
      );

    });

  }


  /*
   * ============================================================
   * PAUSE
   * ============================================================
   */

  function getBreakForSlot(start, end) {

    for (const pause of BREAKS) {

      if (
        start >= pause.start &&
        end <= pause.end
      ) {

        return pause;
      }
    }

    return null;
  }


  /*
   * ============================================================
   * AFFICHAGE D'UN COURS
   * ============================================================
   */

  function createCourseElement(event) {

    const div = document.createElement("div");

    div.className = "course";


    const name = document.createElement("div");

    name.className = "course-name";

    name.textContent =
      event.summary || "Cours sans nom";


    const time = document.createElement("div");

    time.className = "course-time";

    time.textContent =
      `${formatTime(event.start)} – ${formatTime(event.end)}`;


    div.appendChild(name);
    div.appendChild(time);

    return div;

  }


  /*
   * ============================================================
   * AFFICHAGE D'UNE JOURNÉE
   * ============================================================
   */

  function renderDay(
    dateKey,
    allClasses
  ) {

    const wrapper =
      document.createElement("div");

    wrapper.className = "day";


    /*
     * Titre du jour
     */

    const title =
      document.createElement("h2");

    title.textContent =
      formatDate(dateFromKey(dateKey));

    wrapper.appendChild(title);


    /*
     * Récupérer les événements du jour
     * pour chaque classe.
     */

    const dayEvents = allClasses.map(events =>
      events.filter(
        event =>
          getDateKey(event.start) === dateKey
      )
    );


    /*
     * S'il n'y a aucun cours.
     */

    const hasEvents =
      dayEvents.some(events =>
        events.length > 0
      );

    if (!hasEvents) {

      const noData =
        document.createElement("div");

      noData.className = "no-data";

      noData.textContent =
        "Aucun cours ce jour.";

      wrapper.appendChild(noData);

      return wrapper;
    }


    /*
     * Construire les créneaux.
     */

    const times =
      getTimeRows(dayEvents);


    /*
     * TABLE
     */

    const table =
      document.createElement("table");

    table.className = "schedule";


    /*
     * THEAD
     */

    const thead =
      document.createElement("thead");

    const headerRow =
      document.createElement("tr");


    const timeHeader =
      document.createElement("th");

    timeHeader.className =
      "time-column";

    timeHeader.textContent =
      "Horaire";

    headerRow.appendChild(timeHeader);


    for (const className of CLASS_NAMES) {

      const th =
        document.createElement("th");

      th.className =
        "class-column";

      th.textContent =
        `Classe ${className}`;

      headerRow.appendChild(th);
    }


    thead.appendChild(headerRow);

    table.appendChild(thead);


    /*
     * TBODY
     */

    const tbody =
      document.createElement("tbody");


    /*
     * Chaque intervalle de temps.
     */

    for (let i = 0; i < times.length - 1; i++) {

      const start = times[i];
      const end = times[i + 1];


      if (start === end) {
        continue;
      }


      /*
       * Vérifier si c'est une pause.
       */

      const pause =
        getBreakForSlot(start, end);


      const row =
        document.createElement("tr");


      /*
       * Colonne horaire.
       */

      const timeCell =
        document.createElement("td");

      timeCell.className =
        "time-column";

      timeCell.textContent =
        `${formatMinutes(start)} – ${formatMinutes(end)}`;

      row.appendChild(timeCell);


      /*
       * Si c'est une pause.
       */

      if (pause) {

        const pauseCell =
          document.createElement("td");

        pauseCell.colSpan = 3;

        pauseCell.className =
          "pause";

        pauseCell.textContent =
          pause.label;

        row.appendChild(pauseCell);

        tbody.appendChild(row);

        continue;
      }


      /*
       * Une colonne par classe.
       */

      for (
        let classIndex = 0;
        classIndex < 3;
        classIndex++
      ) {

        const cell =
          document.createElement("td");


        const events =
          getEventsAtTime(
            dayEvents[classIndex],
            start,
            end
          );


        if (events.length === 0) {

          const empty =
            document.createElement("div");

          empty.className =
            "empty";

          empty.textContent =
            "—";

          cell.appendChild(empty);

        } else {

          for (const event of events) {

            cell.appendChild(
              createCourseElement(event)
            );

          }
        }


        row.appendChild(cell);

      }


      tbody.appendChild(row);

    }


    table.appendChild(tbody);

    wrapper.appendChild(table);


    return wrapper;

  }


  /*
   * ============================================================
   * FORMAT MINUTES
   * ============================================================
   */

  function formatMinutes(minutes) {

    const hour =
      Math.floor(minutes / 60);

    const minute =
      minutes % 60;

    return (
      String(hour).padStart(2, "0") +
      ":" +
      String(minute).padStart(2, "0")
    );

  }


  /*
   * ============================================================
   * AFFICHER TOUS LES JOURS
   * ============================================================
   */

  function renderAllDays(allClasses) {

    const results =
      document.getElementById("results");

    results.innerHTML = "";


    const days =
      getAllDays(allClasses);


    if (days.length === 0) {

      const panel =
        document.createElement("div");

      panel.className = "panel";

      panel.innerHTML = `
        <div class="no-data">
          Aucun cours trouvé dans les fichiers ICS.
        </div>
      `;

      results.appendChild(panel);

      return;
    }


    /*
     * Afficher chaque jour.
     */

    for (const day of days) {

      results.appendChild(
        renderDay(
          day,
          allClasses
        )
      );

    }

  }


  /*
   * ============================================================
   * BOUTON
   * ============================================================
   */

  document
    .getElementById("showButton")
    .addEventListener("click", async () => {

      const error =
        document.getElementById("error");

      error.style.display = "none";
      error.textContent = "";


      try {

        const fileB1 =
          document.getElementById("fileB1");

        const fileB2 =
          document.getElementById("fileB2");

        const fileB3 =
          document.getElementById("fileB3");


        /*
         * Vérifier que les 3 fichiers sont présents.
         */

        if (
          !fileB1.files.length ||
          !fileB2.files.length ||
          !fileB3.files.length
        ) {

          throw new Error(
            "Veuillez sélectionner les 3 fichiers ICS : B1, B2 et B3."
          );

        }


        /*
         * Lire les fichiers.
         */

        const [
          eventsB1,
          eventsB2,
          eventsB3
        ] = await Promise.all([

          readICSFile(fileB1),

          readICSFile(fileB2),

          readICSFile(fileB3)

        ]);


        /*
         * Tableau final :
         *
         * [
         *   horaires B1,
         *   horaires B2,
         *   horaires B3
         * ]
         */

        const allClasses = [
          eventsB1,
          eventsB2,
          eventsB3
        ];


        /*
         * Afficher.
         */

        renderAllDays(allClasses);

      }

      catch (err) {

        console.error(err);

        error.textContent =
          err.message ||
          "Une erreur est survenue.";

        error.style.display =
          "block";

      }

    });

</script>

</body>
</html>+
